<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social share image (1200 x 630)</title>
<!-- The source of assets/og-image.png. Open this at a 1200x630 window and screenshot it to regenerate the image
     after changing the wording or colours. It is a tool, not a page of the site, so it carries its own styles. -->
<style>
  :root { --ink:#f4f4f7; --muted:#b4b4c0; --accent:#7c3aed; --accent-text:#a78bfa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050507; color: var(--ink);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .bg { position: absolute; inset: 0;
    background: radial-gradient(700px 520px at 8% -10%, rgba(124,58,237,.6), transparent 70%),
                radial-gradient(640px 480px at 100% 10%, rgba(57,135,229,.38), transparent 70%),
                radial-gradient(560px 420px at 55% 120%, rgba(217,89,38,.28), transparent 70%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; margin-bottom: 34px; }
  .brand b { background: linear-gradient(135deg,#c4b5fd,#7c3aed 70%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
  .logo { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(135deg,#a78bfa,#6d28d9); position: relative; box-shadow: 0 0 30px rgba(124,58,237,.6); }
  .logo::before { content: ""; position: absolute; inset: 11px; border: 2.5px solid rgba(255,255,255,.85); border-radius: 50%; }
  .logo::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #fff; right: 8px; top: 8px; }
  h1 { margin: 0; font-size: 68px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 800; }
  h1 span { background: linear-gradient(120deg,#c4b5fd,#8b5cf6 45%,#60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  p { margin: 26px 0 0; font-size: 26px; color: var(--muted); line-height: 1.4; }
  .chips { display: flex; gap: 12px; margin-top: 32px; }
  .chips i { font-style: normal; font-size: 18px; padding: 8px 16px; border-radius: 99px; background: rgba(124,58,237,.18); border: 1px solid rgba(167,139,250,.4); }
  .card { position: absolute; right: 64px; top: 120px; width: 460px; height: 390px; border-radius: 26px; background: #090a10;
    border: 1px solid rgba(255,255,255,.18); box-shadow: 0 40px 80px -20px rgba(0,0,0,.9), 0 0 100px -10px rgba(124,58,237,.55); transform: rotate(3deg); overflow: hidden; }
  .top { display: flex; justify-content: space-between; padding: 16px 22px; font-weight: 700; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .top .b { color: #7db4f2; } .top .o { color: #f09a73; } .top .t { font-family: "Cascadia Code", Consolas, monospace; }
  .pitch { position: absolute; left: 20px; right: 20px; top: 70px; bottom: 54px; border: 2px solid rgba(255,255,255,.16); border-radius: 6px;
    background: linear-gradient(90deg,#0b1322,#0a0b13 50%,#1a1010); }
  .pitch::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.14); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border: 2px solid rgba(255,255,255,.14); border-radius: 50%; }
  .goal { position: absolute; top: 34%; bottom: 34%; width: 14px; } .goal.l { left: -2px; background: linear-gradient(90deg,#3987e5,transparent); } .goal.r { right: -2px; background: linear-gradient(270deg,#d95926,transparent); }
  .car { position: absolute; width: 34px; height: 17px; border-radius: 5px; } .car.b { background: #3987e5; box-shadow: 0 0 18px #3987e5; } .car.o { background: #d95926; box-shadow: 0 0 18px #d95926; }
  .ball { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff,#c4b5fd); box-shadow: 0 0 28px rgba(167,139,250,.95); }
  .bar { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); }
  .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 6px; background: linear-gradient(135deg,#7c3aed,#8a4df0); box-shadow: 0 0 14px rgba(124,58,237,.8); }
  .float { position: absolute; right: 30px; bottom: 30px; width: 250px; padding: 16px 18px; border-radius: 18px; background: rgba(21,21,27,.94);
    border: 1px solid rgba(255,255,255,.18); box-shadow: 0 20px 50px rgba(0,0,0,.7); }
  .float small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #868695; font-weight: 700; }
  .float b { font-size: 38px; font-weight: 800; } .float em { font-style: normal; color: #34d399; font-size: 17px; margin-left: 8px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="copy">
    <div class="brand"><span class="logo"></span><span><b>RL</b> Analyser</span></div>
    <h1>Understand <span>why you win</span>, and why you lose.</h1>
    <p>Rocket League replay analysis with a private AI coach on your own PC.</p>
    <div class="chips"><i>2D replay</i><i>Key moments</i><i>Rank stats</i><i>AI coach</i></div>
  </div>
  <div class="card">
    <div class="top"><span><span class="b">1</span> &ndash; <span class="o">0</span></span><span class="t">4:12</span></div>
    <div class="pitch">
      <span class="goal l"></span><span class="goal r"></span>
      <span class="car b" style="left:120px;top:92px;transform:rotate(-14deg)"></span>
      <span class="car b" style="left:46px;top:170px;transform:rotate(20deg)"></span>
      <span class="car o" style="left:262px;top:84px;transform:rotate(190deg)"></span>
      <span class="car o" style="left:318px;top:150px;transform:rotate(160deg)"></span>
      <span class="ball" style="left:176px;top:112px"></span>
    </div>
    <div class="bar"></div>
  </div>
  <div class="float"><small>Goals &middot; last 10</small><b>1.20</b><em>&#9650; 0.35</em></div>
</body>
</html>
