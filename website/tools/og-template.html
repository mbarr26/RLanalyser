<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social share image (1200 x 630)</title>
<!-- The source of assets/og-image.png. Open this at a 1200x630 window and screenshot it to regenerate the image
     after changing the wording or colours. It is a tool, not a page of the site, so it carries its own styles.
     Neutral and flat like the site: black, white and greys, with colour only on the two teams. -->
<style>
  :root { --ink:#f5f5f7; --muted:#aeaeb2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; margin-bottom: 36px; letter-spacing: -0.012em; }
  .brand b { font-weight: 800; }
  .logo { width: 46px; height: 46px; border-radius: 13px; background: #f5f5f7; position: relative; }
  .logo::before { content: ""; position: absolute; inset: 11px; border: 2.5px solid #1d1d1f; border-radius: 50%; }
  .logo::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #1d1d1f; right: 8px; top: 8px; }
  h1 { margin: 0; font-size: 72px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 700; }
  h1 span { color: #98989f; }
  p { margin: 28px 0 0; font-size: 26px; color: var(--muted); line-height: 1.4; }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chips i { font-style: normal; font-size: 18px; padding: 8px 18px; border-radius: 99px; background: rgba(255,255,255,.12); }
  .card { position: absolute; right: 64px; top: 120px; width: 460px; height: 390px; border-radius: 28px; background: #0b0b0e;
    box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 40px 80px -20px rgba(0,0,0,.9); overflow: hidden; }
  .top { display: flex; justify-content: space-between; padding: 16px 22px; font-weight: 700; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .top .b { color: #7db4f2; } .top .o { color: #f09a73; } .top .t { font-family: "Cascadia Code", Consolas, monospace; }
  .pitch { position: absolute; left: 20px; right: 20px; top: 70px; bottom: 54px; border: 2px solid rgba(255,255,255,.16); border-radius: 8px; background: #07080d; }
  .pitch::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.14); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border: 2px solid rgba(255,255,255,.14); border-radius: 50%; }
  .goal { position: absolute; top: 34%; bottom: 34%; width: 6px; } .goal.l { left: -2px; background: #3987e5; } .goal.r { right: -2px; background: #d95926; }
  .car { position: absolute; width: 34px; height: 17px; border-radius: 5px; } .car.b { background: #3987e5; } .car.o { background: #d95926; }
  .ball { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: #f5f5f7; }
  .bar { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.16); }
  .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 6px; background: #f5f5f7; }
  .float { position: absolute; right: 30px; bottom: 30px; width: 250px; padding: 16px 18px; border-radius: 20px; background: #1c1c1e;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.7); }
  .float small { display: block; font-size: 14px; color: #98989f; font-weight: 500; }
  .float b { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; } .float em { font-style: normal; color: #4ade80; font-size: 17px; margin-left: 8px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span class="logo"></span><span><b>RL</b> Analyser</span></div>
    <h1>Understand <span>why you win</span>, and why you lose.</h1>
    <p>Rocket League replay analysis with a private AI coach on your own PC.</p>
    <div class="chips"><i>2D replay</i><i>Key moments</i><i>Rank stats</i><i>AI coach</i></div>
  </div>
  <div class="card">
    <div class="top"><span><span class="b">1</span> &ndash; <span class="o">0</span></span><span class="t">4:12</span></div>
    <div class="pitch">
      <span class="goal l"></span><span class="goal r"></span>
      <span class="car b" style="left:120px;top:92px;transform:rotate(-14deg)"></span>
      <span class="car b" style="left:46px;top:170px;transform:rotate(20deg)"></span>
      <span class="car o" style="left:262px;top:84px;transform:rotate(190deg)"></span>
      <span class="car o" style="left:318px;top:150px;transform:rotate(160deg)"></span>
      <span class="ball" style="left:176px;top:112px"></span>
    </div>
    <div class="bar"></div>
  </div>
  <div class="float"><small>Goals &middot; last 10 games</small><b>1.20</b><em>&#9650; 0.35</em></div>
</body>
</html>
